spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_trading?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

market-data:
  twelve-data:
    api-key: ${TWELVE_DATA_API_KEY}
    base-url: https://api.twelvedata.com
    min-request-interval-ms: 8000

sec:
  base-url: https://www.sec.gov
  data-base-url: https://data.sec.gov
  user-agent: ${SEC_USER_AGENT}

valuation-universe:
  classification-effective-from: 2020-01-01
  classification-source: MANUAL
  price-start-date: 2024-12-01
  price-end-date: 2026-07-31

sharadar:
  tickers-file: C:/DEV2/trading-lab/data/sharadar/tickers.csv
  stocks-file: C:/DEV2/trading-lab/data/sharadar/stocks.csv.zip
  fundamentals-file: C:/DEV2/trading-lab/data/sharadar/fundamentals.csv.zip
  actions-file: C:/DEV2/trading-lab/data/sharadar/actions.csv.zip
  stocks-checkpoint-file: C:/DEV2/trading-lab/data/sharadar/checkpoints/stocks-price-import.chk



